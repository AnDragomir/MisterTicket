<section class="auth">
  <p class="eyebrow">Sign in</p>
  <h1 class="auth__title">Welcome back</h1>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="field__error">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input class="field__input" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
      <span class="field__error">Enter your password.</span>
      }
    </label>

    @if (errorMessage()) {
    <p class="form__error">{{ errorMessage() }}</p>
    }

    <button class="cta" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="auth__switch">
    No account yet? <a routerLink="/register">Create one</a>
  </p>
</section>
